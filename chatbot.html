<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#181c1e" />
  <title>THΛTJOINT / INTELLIGENCE Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23A459FF'/%3E%3Cpath d='M7 9h18v4h-7v12h-4V13H7z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=20260927-2" />
  <link rel="stylesheet" href="chatbot.css" />
  <style>
    body {
      background: #111416;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0;
      color: #f4f5f4;
    }
    .terminal-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #181c1e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .terminal-page-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .terminal-page-nav a {
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.2s;
    }
    .terminal-page-nav a:hover,
    .terminal-page-nav a.is-current {
      color: var(--purple, #A459FF);
    }
    .terminal-wrapper-full {
      flex: 1 1 auto;
      display: flex;
      padding: 20px 24px;
      box-sizing: border-box;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }
    .terminal-wrapper-full .tj-terminal-container {
      width: 100%;
      height: calc(100vh - 110px);
      max-height: none;
    }
    @media (max-width: 768px) {
      .terminal-wrapper-full {
        padding: 0;
      }
      .terminal-wrapper-full .tj-terminal-container {
        height: calc(100vh - 65px);
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <header class="terminal-page-header">
    <a class="brand" href="index.html" aria-label="THATJOINT home">THΛTJOINT<span>.</span></a>
    <nav class="terminal-page-nav" aria-label="Terminal Navigation">
      <a href="index.html">← Back to Overview</a>
      <a href="building-tour.html">3D Building Tour ↗</a>
      <a href="chatbot.html" class="is-current">Terminal Console</a>
    </nav>
  </header>

  <main class="terminal-wrapper-full">
    <div id="terminalApp" style="width: 100%;"></div>
  </main>

  <script src="chatbot.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var terminal = new ThatJointChatbot({
        containerId: 'terminalApp',
        isDrawer: false,
        activeUnit: 'Home 014'
      });

      // Handle crosslink requests to 3D Tour
      terminal.on('selectZone3D', function (zone) {
        window.location.href = 'building-tour.html?zone=' + encodeURIComponent(zone);
      });
    });
  </script>
</body>
</html>
